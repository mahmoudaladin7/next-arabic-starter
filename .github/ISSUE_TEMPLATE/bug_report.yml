name: Bug report
description: Something looks or works wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead? Screenshots help a lot with layout bugs.
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Which language?
      options:
        - Arabic (right to left)
        - English (left to right)
        - Both
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page or file
      placeholder: /ar/blog or src/components/locale-switcher.tsx
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Safari 18 on iPhone
